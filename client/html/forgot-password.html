<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <title>AttendPro - Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="floating-shapes">
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
        </div>

        <div class="auth-box">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                </div>
                <h1>AttendPro</h1>
                <p>Enter your email to reset your password</p>      
            </div>

            <form id="forgotPasswordForm">
                <div class="error-message" id="errorMessage" style="display:none; color:red; margin-bottom: 10px;"></div>
                <div class="success-message" id="successMessage" style="display:none; color:green; margin-bottom: 10px;"></div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>   
                            <path d="M22 7l-10 6L2 7"/>
                        </svg>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top:20px;">
                    <span>Send Reset Link</span>
                </button>
                <div style="text-align: center; margin-top:20px;">
                    <a href="login.html" style="color: #2563EB; text-decoration: none;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
